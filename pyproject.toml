[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iac-tool"
version = "0.1.0"
description = "Declarative infrastructure as code tool for Yandex Cloud based on the official Python SDK."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Dmitry Adarov" }
]
dependencies = [
  "typer>=0.12,<1.0",
  "PyYAML>=6.0,<7.0",
  "pydantic>=2.8,<3.0",
  "yandexcloud>=0.387.0,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[project.scripts]
iac-tool = "iac_tool.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: tests that use a real Yandex Cloud account",
]

